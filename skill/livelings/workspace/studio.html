<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Livelings studio</title>
    <style>
      :root { --paper: #f4f0e6; --card: #fffdf8; --ink: #171614; --muted: #6b665c; --soft: #ece6d8; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr; background: var(--paper); color: var(--ink); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif; }
      header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; }
      header h1 { margin: 0; font-size: 20px; }
      header small { color: var(--muted); }
      header .grow { flex: 1; }
      button, select { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--soft); font: inherit; cursor: pointer; }
      button:hover { background: #e3dccb; }
      button.on { background: var(--ink); color: #fff; }
      #stage { position: relative; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="name">Livelings</h1>
      <small id="tagline"></small>
      <small class="grow">· tap a tile to see it big; poke, drag, rub, tap three times</small>
      <select id="palette" aria-label="Palette"></select>
      <button id="png" type="button">PNG</button>
      <button id="poses" type="button">Pose sheet</button>
      <button id="rec" type="button">● Record 5s</button>
    </header>
    <div id="stage">
      <canvas id="grid"></canvas>
    </div>
    <script type="module" src="./studio.js"></script>
  </body>
</html>
